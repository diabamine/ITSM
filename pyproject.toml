[project]
name = "itsm-insights"
version = "0.1.0"
description = "ITSM ticket analytics: designation clustering, lifecycle stats, classification / sentiment / weak-signal models, served over FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Diametral" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "joblib>=1.4",
    "typer>=0.15",
    "rich>=13.9",
    "pyarrow>=17.0",
    "streamlit>=1.40",
    "altair>=5.4",
    "umap-learn>=0.5.7",
    "hdbscan>=0.8.39",
    "matplotlib>=3.11.2",
    # --- every arm of every experiment notebook, mandatory ------------------
    # These were optional extras. They are required now so no comparison can
    # silently skip an arm: a benchmark missing a competitor is not a
    # benchmark. The cost is a heavy install (torch dominates) and a first run
    # that downloads model weights; both are one-time.
    "sentence-transformers>=3.3",   # dense embeddings (notebooks 3, 5)
    "transformers>=4.46",           # HF NER + sentiment (notebooks 1, 4)
    "torch>=2.4",                   # backs both of the above
    "presidio-analyzer>=2.2",       # PII analyser (notebook 1)
    "spacy>=3.7",                   # Presidio's NLP engine
    "gliner>=0.2.13",               # zero-shot PII (notebook 1)
    "prophet>=1.1.5",               # forecasting detector (notebook 2)
    "anthropic>=1.0",               # LLM arm (notebooks 3, 4)
    "jupyter>=1.1",                 # to run the notebooks at all
]

[project.optional-dependencies]
# Public dataset adapters (Hugging Face Hub / UCI archives).
datasets = ["datasets>=3.1", "requests>=2.32"]

[project.scripts]
itsm = "itsm.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "watchdog>=5.0",
    "jupyter>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itsm"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D107", "D203", "D213", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# No python_version pin: mypy follows the interpreter it runs under, which
# keeps it compatible with the typeshed bundled with the installed numpy.
packages = ["itsm"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: needs optional heavy dependencies (transformers, hdbscan)"]
